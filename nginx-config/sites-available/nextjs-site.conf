# ===========================================
# ШАБЛОН ДЛЯ NEXT.JS САЙТА (SSR / App Router)
# Замени: example.com → твой домен
# Замени: 3000 → порт приложения (уникальный для каждого сайта)
# ===========================================

upstream example_com {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com www.example.com;

    # SSL (Certbot заполнит автоматически)
    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Логи
    access_log /var/log/nginx/example.com.access.log;
    error_log  /var/log/nginx/example.com.error.log;

    # Статика Next.js — отдаём напрямую (быстро, без Node.js)
    location /_next/static/ {
        alias /var/www/example.com/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Публичные файлы (images, fonts, etc.)
    location /public/ {
        alias /var/www/example.com/public/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Всё остальное → Next.js процесс (PM2)
    location / {
        proxy_pass http://example_com;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Безопасность
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
}
