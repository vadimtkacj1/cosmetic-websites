# ===========================================
# ШАБЛОН ДЛЯ СТАТИЧЕСКОГО САЙТА (index.html)
# Замени: example.com → твой домен
# Замени: /var/www/example.com → путь к файлам
# ===========================================

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # Редирект на HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com www.example.com;

    # SSL (Certbot заполнит автоматически)
    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Корень сайта
    root /var/www/example.com;
    index index.html;

    # Логи
    access_log /var/log/nginx/example.com.access.log;
    error_log  /var/log/nginx/example.com.error.log;

    # Кэш статики
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|css|js)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA: все пути → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Безопасность
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
}
