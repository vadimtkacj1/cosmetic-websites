upstream irena_beauty_com {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name irena-beauty.com www.irena-beauty.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name irena-beauty.com www.irena-beauty.com;

    ssl_certificate     /etc/letsencrypt/live/irena-beauty.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/irena-beauty.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/irena-beauty.com.access.log;
    error_log  /var/log/nginx/irena-beauty.com.error.log;

    location /_next/static/ {
        alias /var/www/irena-beauty.com/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /public/ {
        alias /var/www/irena-beauty.com/public/;
        expires 30d;
    }

    location / {
        proxy_pass http://irena_beauty_com;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
}
