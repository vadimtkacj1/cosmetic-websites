server {
    listen 80;
    listen [::]:80;
    server_name maayan-cosmetics.com www.maayan-cosmetics.com;

    root  /var/www/maayan-cosmetics.com;
    index index.html;

    access_log /var/log/nginx/maayan-cosmetics.com.access.log;
    error_log  /var/log/nginx/maayan-cosmetics.com.error.log;

    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|mp4|woff|woff2|ttf|css|js)$ {
        expires 30d;
        add_header Cache-Control "public, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
}
