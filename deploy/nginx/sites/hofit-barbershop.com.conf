server {
    listen 80;
    listen [::]:80;
    server_name hofit-barbershop.com www.hofit-barbershop.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hofit-barbershop.com www.hofit-barbershop.com;

    ssl_certificate     /etc/letsencrypt/live/hofit-barbershop.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hofit-barbershop.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root  /var/www/hofit-barbershop.com;
    index index.html;

    access_log /var/log/nginx/hofit-barbershop.com.access.log;
    error_log  /var/log/nginx/hofit-barbershop.com.error.log;

    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|mp4|woff|woff2|ttf|css|js)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
}
